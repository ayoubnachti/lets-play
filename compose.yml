# compose.yaml
services:
  mongodb:
    image: mongo:8.0
    container_name: lets-play-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lets-play-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env   
    environment:
      MONGODB_URI: mongodb://mongodb:27017/lets-play
    depends_on:
      - mongodb

volumes:
  mongo-data: