spring:
  application:
    name: lets-play
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/lets-play}
  data:
    mongodb:
      auto-index-creation: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

server:
  port: 8080
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE_PATH:file:./keystore.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12

admin:
  seed:
    email: ${ADMIN_EMAIL:admin@gmail.com}
    password: ${ADMIN_PASSWORD}